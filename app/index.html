<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== tokens ===== */
:root{
  --red:#AB0018; --red-hi:#E5323E; --coral:#FF8A7A;
  --grad:linear-gradient(135deg,#EC4050 0%,#C8102E 45%,#9E0016 100%);
  --grad-soft:linear-gradient(135deg,#FFE3DF 0%,#FFF1EE 100%);
  --ink:#1B1416; --ink-2:#4A4247; --gray:#6E666B; --line:#F0E9E7;
  --tint:#FFEDEA; --tint-2:#FFD9D3; --field:#F7F3F2; --card:#FFFFFF;
  --ok:#1F6E45;
  --s1:#AB0018; --s2:#E8846F;
  --sh:0 1px 1px rgba(80,20,20,.03),0 6px 20px rgba(120,30,30,.05);
  --sh-lg:0 12px 32px rgba(158,0,22,.28);
  --r:22px; --r-sm:14px;
  --spring:cubic-bezier(.32,1.25,.4,1); --ease:cubic-bezier(.22,1,.36,1);
  --glass:rgba(255,255,255,.72); --glass-b:1px solid rgba(255,255,255,.85);
  --f:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#FFF4F1}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(40% 30% at 10% 35%,rgba(255,170,155,.28),transparent 70%),radial-gradient(45% 35% at 95% 75%,rgba(236,64,80,.12),transparent 70%),radial-gradient(50% 30% at 50% 100%,rgba(255,200,190,.3),transparent 70%)}
body{font-family:var(--f);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 60% at 100% 0%,#FFE1DB 0%,rgba(255,225,219,0) 60%),linear-gradient(180deg,#FFF4F1 0%,#FBF8F7 40%,#F8F5F4 100%);min-height:100vh;font-feature-settings:"tnum" 1}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;padding:0 18px calc(110px + env(safe-area-inset-bottom))}

/* ===== tipografia ===== */
.t-display{font-size:1.75rem;font-weight:800;letter-spacing:-.03em;line-height:1.12}
.t-title{font-size:1.22rem;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.t-sec{font-size:1.06rem;font-weight:700;letter-spacing:-.01em}
.t-body{font-size:.94rem;font-weight:500;color:var(--ink-2)}
.t-cap{font-size:.82rem;font-weight:500;color:var(--gray)}
.t-num{font-weight:800;letter-spacing:-.03em}
.muted{color:var(--gray)}

/* ===== splash ===== */
.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 28px calc(40px + env(safe-area-inset-bottom));
  background:radial-gradient(90% 55% at 50% 30%,#FFFFFF 0%,#FFF1EE 45%,rgba(255,241,238,0) 75%),linear-gradient(180deg,#FFF6F4 0%,#FFE4DE 60%,#FFB9AE 100%);transition:opacity .35s,transform .35s}
.splash.out{opacity:0;transform:scale(1.03);pointer-events:none}
.splash .logo{width:min(62vw,250px);position:absolute;top:14vh;left:50%;transform:translateX(-50%);filter:drop-shadow(0 18px 30px rgba(171,0,24,.18));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateX(-50%) translateY(-8px)}}
.splash .word{font-size:.82rem;font-weight:800;letter-spacing:.32em;color:var(--red);margin-bottom:14px}
.splash h1{font-size:2rem;font-weight:800;letter-spacing:-.035em;line-height:1.1;text-align:center}
.splash p{margin:12px 0 28px;text-align:center;color:var(--ink-2);font-weight:500;max-width:300px}
.btn-dark{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:380px;height:56px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:1rem;box-shadow:0 10px 24px rgba(27,20,22,.25)}
.btn-dark:active{transform:scale(.98)}
.btn-dark:disabled{opacity:.6}
.lg-in{margin-bottom:12px;background:rgba(255,255,255,.85);text-align:center}
.lg-back{display:block;margin:14px auto 0;color:var(--ink-2)}
.empty{text-align:center;padding:28px 20px}
.empty .t-sec{margin-bottom:4px}

/* ===== topo ===== */
.topbar{display:flex;align-items:center;gap:12px;margin:0 -18px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,rgba(255,244,241,.78) 60%,rgba(255,244,241,0));-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);-webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);mask-image:linear-gradient(180deg,#000 75%,transparent)}
.topbar .grow{flex:1;min-width:0}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--glass);border:var(--glass-b);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.icon-btn svg{width:20px;height:20px}
.badge{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red-hi);box-shadow:0 0 0 2px #fff}
.me{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.me img{width:34px;height:34px;object-fit:contain}

/* ===== cards ===== */
.card{background:var(--glass);border:var(--glass-b);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.stack>*+*{margin-top:14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sec-head .link{font-size:.86rem;font-weight:700;color:var(--red);min-height:44px;padding:0 4px;display:inline-flex;align-items:center}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--red-hi);color:#fff;font-size:.75rem;font-weight:800;margin-left:8px;vertical-align:2px}
.count.soft{background:var(--tint);color:var(--red)}
.hero{background:var(--grad);color:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sh-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%)}
.hero .lbl{font-size:.82rem;font-weight:600;opacity:.85}
.hero .big{font-size:2.1rem;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:4px}
.hero .sub{font-size:.86rem;opacity:.85;margin-top:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--glass);border:var(--glass-b);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;display:flex;flex-direction:column;min-height:150px}
.mini .lbl{font-size:.78rem;font-weight:600;color:var(--gray)}
.mini .val{font-size:1.35rem;font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1.15}
.mini .val small{font-size:.8rem;font-weight:600;color:var(--ink);letter-spacing:0;margin-left:4px}
.mini .spark{margin-top:auto;height:52px;display:flex;align-items:flex-end;gap:3px}
.mini .spark i{flex:1;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,#F26B6B,#FFC9C1)}
.mini .spark i.on{background:linear-gradient(180deg,#C8102E,#EC4050)}
.mini .hint{font-size:.75rem;color:var(--gray);margin-top:6px}

/* ===== listas ===== */
.row{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.88rem;color:var(--red);background:var(--grad-soft);box-shadow:inset 0 0 0 1px rgba(171,0,24,.06)}
.av.lg{width:56px;height:56px;font-size:1.05rem}
.av.w{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--glass);border:var(--glass-b);border-radius:18px;box-shadow:var(--sh)}
.item+.item{margin-top:10px}
.sw,.nsw{position:relative;border-radius:18px}.sw+.sw,.sw+.nsw,.nsw+.sw,.nsw+.nsw{margin-top:10px}
.sw::before{content:"Remover";position:absolute;inset:0;border-radius:18px;background:#E9DCDD;color:#5B3A40;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;transition:background .15s,color .15s}
.sw.arm::before{background:var(--red);color:#fff}.sw .item,.nsw .item{position:relative;background:#FFFDFC;touch-action:pan-y}
.sw.sai{transition:opacity .2s;opacity:0}
.toast.acao{white-space:nowrap;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;z-index:99}.toast.acao button{color:#FFB3BE;font-weight:800;padding:8px 10px;min-height:40px;background:none;border:0;font:inherit;font-weight:800}
.item .txt{flex:1;min-width:0}
.item .ttl{font-weight:700;font-size:.95rem;line-height:1.3}
.item .sub{font-size:.82rem;color:var(--gray);margin-top:2px}
.item .sub b{color:var(--ink-2);font-weight:600}
.late{color:var(--red)!important;font-weight:600}
.acts{display:flex;gap:8px;flex:none}
.round{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--field);color:var(--ink);flex:none;transition:transform .15s}
.round:active{transform:scale(.92)}
.round svg{width:19px;height:19px}
.round.wa{background:var(--tint);color:var(--red);position:relative}
.round.wa.bot::after{content:"🌺";position:absolute;right:-3px;top:-4px;font-size:.68rem;line-height:1}
.round.done{background:var(--ink);color:#fff}
.right{text-align:right;flex:none}
.right .n{font-weight:700;font-size:1.05rem;letter-spacing:-.02em}
.right .c{font-size:.8rem;color:var(--gray);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.red{background:var(--tint);color:var(--red)}
.pill.solid{background:var(--red);color:#fff}
.pill.gray{background:var(--field);color:var(--ink-2)}
.pill.green{background:#E6F4EC;color:var(--ok)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* carrossel */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 18px;margin:0 -18px;padding:4px 18px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.snap{scroll-snap-align:start;flex:0 0 82%;background:var(--glass);border:var(--glass-b);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer}
.snap .meta{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.84rem;font-weight:600;color:var(--ink-2)}
.snap .meta span{display:flex;align-items:center;gap:6px}
.snap .meta svg{width:16px;height:16px;color:var(--gray)}

/* chips / busca */
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;background:var(--glass);border:var(--glass-b);border-radius:999px;box-shadow:var(--sh)}
.search svg{width:18px;height:18px;color:var(--gray)}
.search input{flex:1;border:0;outline:0;font:500 16px var(--f);background:none;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 4px;padding:0 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:44px;padding:0 16px;border-radius:999px;background:var(--glass);border:var(--glass-b);box-shadow:var(--sh);font-weight:600;font-size:.86rem;white-space:nowrap;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;box-shadow:none;border-color:transparent}
.chip .k{font-size:.8rem;opacity:.7}

/* ===== ficha ===== */
.profile{background:var(--grad);border-radius:26px;padding:20px;color:#fff;box-shadow:var(--sh-lg);position:relative;overflow:hidden}
.profile::after{content:"";position:absolute;left:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
.profile .name{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.profile .sub{font-size:.86rem;opacity:.85}
.ring-wrap{display:flex;align-items:center;gap:18px;margin-top:18px;position:relative;z-index:1}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .in span{font-size:.79rem;opacity:.85;margin-top:3px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;flex:1}
.facts .l{font-size:.8rem;opacity:.8}
.facts .v{font-size:.98rem;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--glass);border:var(--glass-b);border-radius:999px;padding:5px;box-shadow:var(--sh);margin:18px 0 14px}
.tabs button{flex:1;height:44px;border-radius:999px;font-weight:600;font-size:.86rem;color:var(--ink-2)}
.tabs button.on{background:var(--ink);color:#fff}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1 0 auto;padding:0 13px}
.ent{display:flex;gap:12px;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}.ent:first-child{border-top:0;padding-top:2px}
.ent .hh{font-weight:700;min-width:46px;font-variant-numeric:tabular-nums}.ent .tx{font-size:.88rem;color:var(--ink-2);line-height:1.45;flex:1}
.multi{display:grid;gap:8px}.chk{display:flex;gap:12px;align-items:center;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--field);font-size:.92rem;color:var(--ink)}.chk input{width:20px;height:20px;accent-color:var(--red);flex:none}
body.sem-nav #nav{display:none}.termo p{margin:0 0 12px}.termo p:last-child{margin:0}
.tpbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.tpbar .btn-line{height:46px;font-size:.84rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0}
.kv div{padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.kv div:nth-last-child(-n+2){border-bottom:0}
.kv .k{color:var(--gray);font-weight:500;padding-right:14px}
.kv .v{font-weight:600;text-align:right}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .dot{position:relative;width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid #E7DEDC;background:#fff;margin-top:1px;transition:all .2s}
.step .dot::before{content:"";position:absolute;inset:-10px}
.step .dot svg{width:14px;height:14px;color:#fff;opacity:0}
.step .dot.done{background:var(--ink);border-color:var(--ink)}
.step .dot.done svg{opacity:1}
.step .dot.now{border-color:var(--red);box-shadow:0 0 0 4px var(--tint)}
.step .dot.late{border-color:var(--red)}
.step .tx{flex:1;min-width:0}
.step .tt{font-weight:600;font-size:.93rem;line-height:1.3}
.step.isdone .tt{color:var(--gray)}
.step .ss{font-size:.8rem;color:var(--gray);margin-top:2px}
.pay{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pay:last-child{border-bottom:0}
.pay .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--field);flex:none}
.pay .ic svg{width:18px;height:18px}
.pay.paid .ic{background:#E6F4EC;color:var(--ok)}
.pay.late .ic{background:var(--tint);color:var(--red)}
.bar-prog{height:8px;border-radius:999px;background:var(--field);overflow:hidden;margin-top:10px}
.bar-prog i{display:block;height:100%;border-radius:999px;background:var(--grad)}

/* ===== charts ===== */
.chart{position:relative;margin-top:26px}
.plot{position:relative}
.bars{display:flex;align-items:flex-end;gap:3px;position:relative;z-index:1}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative}
.bar .seg{border-radius:4px 4px 0 0;background:var(--s1);transition:opacity .2s}
.bar .seg+.seg{border-radius:0}
.bar .seg.gap{margin-bottom:2px}
.bar.dim .seg{opacity:.35}
.bar .lab{position:absolute;left:-8px;right:-8px;text-align:center;font-weight:700;font-size:.78rem;color:var(--ink)}
.over{background:repeating-linear-gradient(45deg,var(--s1) 0 4px,#fff 4px 6px)!important;box-shadow:inset 0 0 0 1px var(--s1)}
.grid{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.grid.cap{border-top:1.5px dashed var(--ink)}
.grid span{position:absolute;right:0;top:-1.5em;font-weight:600;font-size:.8rem;color:var(--gray);background:#fff;padding:0 4px;border-radius:4px}
.grid.cap span{color:var(--ink)}
.base{border-top:1px solid var(--ink-2)}
.xl{display:flex;gap:3px;margin-top:8px}
.xl span{flex:1;text-align:center;font-size:.8rem;font-weight:600;color:var(--gray);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tip{margin-top:14px;background:var(--field);border-radius:14px;padding:12px 14px;font-size:.88rem}
.tip b{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:10px 2px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{font-size:.8rem;color:var(--gray);font-weight:600}
.r{text-align:right}

/* ===== form ===== */
.field{margin-top:16px}
.field label{display:block;font-size:.84rem;font-weight:600;color:var(--ink-2);margin:0 0 8px 4px}
.input{width:100%;height:52px;border-radius:16px;border:1.5px solid transparent;background:var(--field);padding:0 16px;font:500 16px var(--f);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;transition:all .15s}
.input:focus{background:#fff;border-color:var(--red);box-shadow:0 0 0 4px var(--tint)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--field);border:1.5px solid transparent;width:100%;text-align:left;transition:all .15s}
.opt+.opt{margin-top:8px}
.opt .tx{flex:1}
.opt .tt{font-weight:700;font-size:.92rem}
.opt .ss{font-size:.8rem;color:var(--gray)}
.opt .pr{font-weight:800;font-size:.95rem}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid #D8CFCD;flex:none;display:flex;align-items:center;justify-content:center}
.opt.on{background:#fff;border-color:var(--red);box-shadow:0 0 0 4px var(--tint)}
.opt.on .radio{border-color:var(--red)}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
.seg-ctl{display:flex;gap:6px;background:var(--field);border-radius:16px;padding:5px}

function parcelas(g){
  const t=honorario(g),out=[];
  const mesDpp=new Date(g.dpp.getFullYear(),g.dpp.getMonth(),CFG.diaVenc,12);
  if(g.pag==='credito'||g.pag==='pix'){out.push({venc:g.contrato,v:t})}
  else if(g.pag==='contrato'){const e=Math.round(t*CFG.pct/100),c=g.contrato;
    const v1=new Date(c.getFullYear(),c.getMonth()+1,CFG.diaVenc,12);
    let v2=add(add(g.dpp,-280),CFG.semRest*7);if(v2<v1)v2=v1;
    out.push({venc:v1,v:e});out.push({venc:v2,v:t-e,aviso:add(v2,-2),fin:true})}
  else if(g.pag==='entrada'){out.push({venc:g.contrato,v:Math.round(t/2)});out.push({venc:mesDpp,v:t-Math.round(t/2)})}
  else{
    const n=Math.max(1,g.n||1);const base=Math.floor(t/n);
    for(let i=0;i<n;i++){let v=i===0?g.contrato:new Date(g.contrato.getFullYear(),g.contrato.getMonth()+i,CFG.diaVenc,12);if(v>mesDpp)v=mesDpp;out.push({venc:v,v:base+(i===n-1?t-base*n:0)})}
  }
  return out.map((p,i)=>{const k='$'+i;const pago=k in g.feitos?g.feitos[k]:(p.venc<TODAY&&!(g.atraso||[]).includes(i))||(diff(TODAY,p.venc)===0&&g.pag!=='parcelado');return {...p,i,k,n:i+1,de:out.length,pago}});

    if(!g.parto&&!dispensado(g,'b1')&&g.feitos.b0&&!g.feitos.b1){const d=mv(g,'b1')||g.contrato;out.push({g,x:{kind:'onb',id:'b1',t:'Dados de pagamento'},data:d<TODAY?TODAY:d,late:false,t:'Dados de pagamento e 1ª parcela',sub:PIX?'Depois que ela assinar':'Cadastre os dados de pagamento antes'})}
    if(!g.parto) steps(g).forEach(e=>{if(!e.feito&&add(e.ini,-CFG.antes)<=add(TODAY,lim)&&e.fim>=add(TODAY,-21))out.push({g,x:e,data:e.ini<TODAY&&e.fim>=TODAY?TODAY:e.ini,late:e.fim<TODAY,t:e.t,sub:e.fim<TODAY?`Janela fechou em ${fdm(e.fim)}`:e.ini<=TODAY?`Agora · até ${fdm(e.fim)}`:`A partir de ${fdm(e.ini)}`})});
    posParto(g).forEach(p=>{if(!p.feito&&p.data<=add(TODAY,lim))out.push({g,x:{...p,kind:'pos'},data:p.data,late:p.data<TODAY,t:p.t,sub:p.data<TODAY?`Era para ${fdm(p.data)}`:diff(p.data,TODAY)===0?'Hoje':fwd(p.data)})});
    extras(g).forEach(e=>{if(!e.feito&&!dispensado(g,e.id)&&e.d<=add(TODAY,lim)&&e.d>=add(TODAY,-21))out.push({g,x:{kind:'extra',id:e.id,t:e.t,d:e.d,hora:e.hora},data:e.d,late:e.d<TODAY,t:e.t+(e.hora?' · '+e.hora:''),sub:e.d<TODAY?`Era para ${fdm(e.d)}`:diff(e.d,TODAY)===0?'Hoje':fwd(e.d)})});
    parcelas(g).forEach(p=>{if(!p.pago&&(p.aviso&&p.venc>=TODAY?p.aviso:p.venc)<=add(TODAY,lim))out.push({g,x:{...p,kind:'parc'},data:p.venc<TODAY?p.venc:(p.aviso||p.venc),late:p.venc<TODAY,money:true,t:(g.pag==='contrato'?(p.n===1?`Entrada (${CFG.pct}%)`:`Restante (${100-CFG.pct}%)`):`Parcela ${p.n}/${p.de}`)+` · ${R(p.v)}`,sub:p.venc<TODAY?`Atrasada desde ${fdm(p.venc)}`:`Vence ${fwd(p.venc)}`})});
  });
  return out.sort((a,b)=>a.data-b.data);
}

function linkFicha(){try{return localStorage.getItem('pp-link')||''}catch(e){return ''}}
function copiarLink(){const v=($('n-link').value||'').trim();if(!v){$('n-link').focus();toast('Cole o link da ficha primeiro');return}
  try{localStorage.setItem('pp-link',v)}catch(e){};gravarCfg();
  (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Link copiado')).catch(()=>toast('Segure no campo para copiar'));}
function tsv(t){const rows=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"'&&c==='')q=true;else if(ch==='\t'){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else c+=ch}
  row.push(c);if(row.some(x=>x.trim()))rows.push(row);return rows.map(r=>r.map(x=>x.trim()))}
const vazio=v=>!v||/^(\.|-|n\/?a|nsa|não|nao|0)$/i.test(v.trim());
function dataPlan(v){const m=(v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)return null;let a=+m[1],b=+m[2];const mes=a>12?b:a,dia=a>12?a:b;return `${m[3]}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`}

  const g={nome,dpp:dpp?D(dpp):null,contrato:ts?D(ts):new Date(TODAY),plano,valor:semCurso&&CFG.planos.completo?CFG.planos.completo.valor-(CFG.planos.completo.curso||0):valor,curso:semCurso||plano==='personalizado'?0:undefined,pag,n,ajuste,

    rg:c[2],cpf:c[3],civil:c[4],prof:c[5]||'—',endereco:c[6],bairro:vazio(c[7])?'—':c[7],nasc:c[8],

    acomp:c[14]?`${c[14]}${c[15]?' ('+c[15].toLowerCase()+')':''}`:'—',acompCel:c[16],feitos:{}};
  const t8=c[8]||'',an=t8.match(/(\d{2})\s*anos?/i),nd=t8.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
  if(an)g.idade=+an[1];else if(nd){const bd=new Date(+nd[3],+nd[2]-1,+nd[1]);let y=TODAY.getFullYear()-bd.getFullYear();if(TODAY<new Date(TODAY.getFullYear(),bd.getMonth(),bd.getDate()))y--;g.idade=y}else{const k=t8.match(/^(\d{2})\b/);g.idade=k?+k[1]:'—'}
  return g}
function colar(){

function res(){

function tpGraf(g){

  const ts=[T.chegada&&T.chegada.h,...tq.map(e=>e.h),...av.map(e=>e.h)].filter(Boolean).map(s=>+new Date(s));
  if(!tq.length&&!av.length)return '<div class="t-cap">O gráfico aparece quando houver toque ou BCF registrados.</div>';
  const t0=Math.min(...ts),tN=Math.max(...ts,t0+3600e3),W=340,pl=30,pr=10,pt=10,pb=22;

  let g2=`<svg viewBox="0 0 ${W} ${H2}" width="100%" role="img" aria-label="BCF ao longo do tempo"><rect x="${pl}" y="${Y2(160)}" width="${W-pl-pr}" height="${Y2(110)-Y2(160)}" fill="#E6F4EC"/>`;
  [90,110,160,190].forEach(v=>g2+=`<text x="${pl-5}" y="${Y2(v)+3}" font-size="9" fill="#8A8287" text-anchor="end">${v}</text>`);

  if(novo)LEADS.push(l);$('layer').innerHTML='';
  if(await leadGrava(ant,novo?'Interessada salva':'Salvo')&&novo){S.tab='gest';S.ficha=null;S.tela=null;S.filtro='int';render();
    sheet(`<div class="t-title">Mandar a primeira mensagem?</div><div class="t-cap" style="margin-top:6px">Abre o WhatsApp de ${esc(first(l.nome))} com uma mensagem de boas-vindas. Se você já respondeu, pode fechar.</div>
    <a class="btn-red" style="margin-top:16px;display:flex;align-items:center;justify-content:center;text-decoration:none" href="${wa(leadMsg(l,'ola'),l.cel)}" target="_blank" rel="noopener" onclick="$('layer').innerHTML=''">Abrir WhatsApp</a>`)}}
async function leadFeito(id){const l=LEADS.find(x=>x.id===id),ant=JSON.stringify(LEADS),pr=leadProx(l);if(!pr)return;
  l.feitos=[...(l.feitos||[]),iso(TODAY)];await leadGrava(ant,pr.n+1<FUP.length?`Próximo retorno em ${fwd(add(D(l.criado),FUP[pr.n+1]))}`:'Retornos concluídos')}
function leadNao(id){sheet(`<div class="t-title">Por que não seguiu?</div><div class="t-cap" style="margin-top:4px">Ajuda a entender onde as conversas param.</div>
  <div style="display:grid;gap:8px;margin-top:14px">${MOTIVOS.map(m=>`<button class="btn-line" style="width:100%" onclick="leadNaoOk('${id}','${m}')">${m}</button>`).join('')}</div>`)}
async function leadNaoOk(id,m){const l=LEADS.find(x=>x.id===id),ant=JSON.stringify(LEADS);l.status='nao';l.motivo=m;l.fim=iso(TODAY);$('layer').innerHTML='';
  if(await leadGrava(ant))toastAcao('Marcada como não seguiu','Desfazer',async()=>{l.status='aberta';delete l.motivo;await leadGrava(JSON.stringify(LEADS))})}
async function leadReabre(id){const l=LEADS.find(x=>x.id===id),ant=JSON.stringify(LEADS);l.status='aberta';delete l.motivo;delete l.gid;$('layer').innerHTML='';await leadGrava(ant,'Reaberta')}
async function leadExclui(id){const ant=JSON.stringify(LEADS);LEADS=LEADS.filter(x=>x.id!==id);$('layer').innerHTML='';
  if(await leadGrava(ant))toastAcao('Interessada excluída','Desfazer',async()=>{LEADS=JSON.parse(ant);await leadGrava(JSON.stringify(LEADS.filter(x=>x.id!==id)))})}
function leadFechou(id){const l=LEADS.find(x=>x.id===id);$('layer').innerHTML='';
  S.nova={nome:l.nome,dpp:l.dpp||iso(add(TODAY,170)),plano:firstPlano(),valor:CFG.planos[firstPlano()].valor,pag:'contrato',n:3,ate37:false,extra:{cel:l.cel||'A preencher',indicacao:l.origem||undefined}};
  S.leadConv=id;go('nova');toast('Confira os dados e salve a gestante')}
function leadItem(l){const pr=leadProx(l),late=pr&&pr.d<TODAY;
  const sub=l.status==='fechou'?'Fechou contrato':l.status==='nao'?`Não seguiu${l.motivo?' · '+esc(l.motivo):''}`:pr?`<span class="${late?'late':''}">${pr.n?'2º':'1º'} retorno ${diff(pr.d,TODAY)===0?'hoje':late?'atrasado desde '+fdm(pr.d):fwd(pr.d)}</span>`:'Retornos feitos, aguardando';
  return `<div class="item"><button class="av" onclick="leadForm('${l.id}')" aria-label="Abrir ${esc(l.nome)}">${initials(l.nome)}</button>
    <button class="txt" style="text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit" onclick="leadForm('${l.id}')"><div class="ttl">${esc(l.nome)}</div><div class="sub">${l.dpp?'DPP '+fdm(D(l.dpp))+' · ':''}${sub}</div></button>
    ${l.status==='aberta'?`<div class="acts"><a class="round wa" href="${wa(leadMsg(l,pr?pr.n:1),l.cel)}" target="_blank" rel="noopener" aria-label="Mandar mensagem de retorno">${I.wa}</a>${pr&&pr.d<=TODAY?`<button class="round" onclick="leadFeito('${l.id}')" aria-label="Retorno feito">${I.check}</button>`:''}</div>`:''}</div>`}
function vLeads(){const q=S.busca.toLowerCase(),ok=l=>(l.nome||'').toLowerCase().includes(q);
  const ab=LEADS.filter(l=>l.status==='aberta'&&ok(l)).sort((a,b)=>{const x=leadProx(a),y=leadProx(b);return (x?x.d:9e15)-(y?y.d:9e15)}),fe=LEADS.filter(l=>l.status!=='aberta'&&ok(l)).slice(-15).reverse();
  const tot=LEADS.filter(l=>l.status!=='aberta'),fech=tot.filter(l=>l.status==='fechou').length;
  return `<button class="btn-red" style="margin-top:12px" onclick="leadForm()">+ Nova interessada</button>
  ${tot.length>=3?`<div class="t-cap" style="margin-top:10px;text-align:center">${fech} de ${tot.length} conversas encerradas viraram contrato</div>`:''}
  ${ab.length?`<div class="sec-head"><div class="t-sec">Em conversa<span class="count soft">${ab.length}</span></div></div>${ab.map(leadItem).join('')}`:`<div class="card t-cap" style="margin-top:14px;text-align:center">Ninguém em conversa agora. Quando alguém pedir informações, cadastre aqui e o app lembra de chamar de novo.</div>`}
  ${fe.length?`<div class="sec-head"><div class="t-sec">Encerradas</div></div>${fe.map(leadItem).join('')}`:''}`}
function blocoLeadsHoje(){const L=LEADS.filter(l=>{const p=leadProx(l);return p&&p.d<=TODAY});if(!L.length)return '';
  return `<div class="sec-head"><div class="t-sec">${I.broto.replace('<svg','<svg width="18" height="18" style="vertical-align:-3px;margin-right:6px;color:var(--ok)"')}Retornar para interessadas<span class="count soft">${L.length}</span></div></div>${L.map(leadItem).join('')}`}
/* ============ BACKUP ============ */
const precisaBackup=()=>G.length>0&&(!BKP||diff(TODAY,D(BKP))>=30);
async function backup(){toast('Preparando o backup…');
  const {data,error}=await sb.from('gestantes').select('id,nome,dpp,dados').order('dpp');
  if(error){toast('Não consegui ler os dados. Confira a internet');return}
  const pacote={app:'Papoula',formato:1,exportadoEm:new Date().toISOString(),conta:USER.email,perfil:pegaPerfil(),config:{capacidade:CFG.capacidade,link:linkFicha(),contrato:TPL,pix:PIX,carimbos:CAR,leads:LEADS},gestantes:data};
  const nome=`papoula-backup-${iso(TODAY)}.json`,f=new File([JSON.stringify(pacote,null,1)],nome,{type:'application/json'});
  let ok=false;
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:nome});ok=true}catch(e){if(e&&e.name==='AbortError')return}}
  if(!ok){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
  BKP=iso(TODAY);gravarCfg();toast(`Backup com ${data.length} ${pl(data.length,'gestante')}`);if(S.tab==='hoje')render()}
function avisoBackup(){return precisaBackup()?`<div class="note" style="margin-top:14px">${I.info}<div style="flex:1">${BKP?'Seu último backup tem mais de 30 dias.':'Você ainda não fez backup dos dados.'} Salve uma cópia no seu Drive ou e-mail.<button class="link" style="display:block;margin-top:4px;padding:10px 0;min-height:44px;font-weight:700;color:var(--red)" onclick="backup()">Baixar backup agora</button></div></div>`:''}
/* ============ contrato ============ */
const R2=v=>R(v);
const nomeBebe=g=>{const b=(g.bebe||'').trim();return b&&!/^(-|—|ainda|não|nao|sem)/i.test(b)?b:''};
const chipBebe=g=>nomeBebe(g)?`<span class="baby">${nomeBebe(g)}</span>`:'';
function textoModelo(g,ps){
  const fd=d=>d.toLocaleDateString('pt-BR');
  const forma=g.pag==='contrato'&&ps.length===2?`${CFG.pct}% (${R(ps[0].v)}) até ${fd(ps[0].venc)} e o restante (${R(ps[1].v)}) até a ${CFG.semRest}ª semana completa de gestação, em ${fd(ps[1].venc)}`
    :ps.length>1?`${CFG.pagamentos[g.pag]}, ${ps.length} parcelas`:CFG.pagamentos[g.pag];
  const V={nome:g.nome,civil:g.civil?g.civil.toLowerCase():'________',profissao:g.prof&&g.prof!=='—'?g.prof.toLowerCase():'________',rg:g.rg,cpf:g.cpf,
    endereco:[g.endereco,g.bairro&&g.bairro!=='—'?g.bairro:'','Brasília/DF'].filter(Boolean).join(', '),
    plano:planoDe(g).nome,valor_total:R(total(g))+(g.ajuste?` (${g.ajuste.toLowerCase()})`:''),valor_enfermeira:R(honorario(g)),valor_curso:R(cursoDe(g)),forma_pagamento:forma,
    datas_pagamento:ps.map(q=>`${R(q.v)} em ${fd(q.venc)}`).join('; '),data_contrato:flong(g.contrato),dpp:flong(g.dpp),cidade:CFG.cidade,responsavel:respTxt(g)};
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const pre=menor(g)&&!/\{\{responsavel\}\}/.test(TPL)?`**Responsável legal pela contratante, menor de idade:** ${respTxt(g)||'________'}\n\n`:'';
  return esc(pre+TPL).replace(/\{\{(\w+)\}\}/g,(m,k)=>{const v=V[k];return v?esc(v):'________'}).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
const respTxt=g=>g.respNome?`${g.respNome}${g.respParent?', '+g.respParent.toLowerCase()+' da contratante':''}${g.respCpf?', CPF '+g.respCpf:''}`:'';
function texto(g,ps){
  if(TPL)return textoModelo(g,ps);
  const p=planoDe(g);
  return `<b>CONTRATO DE PRESTAÇÃO DE SERVIÇOS</b>

<b>Contratante:</b> ${g.nome}, ${g.civil?g.civil.toLowerCase()+', ':''}${g.prof&&g.prof!=='—'?g.prof.toLowerCase():'profissão'}, CPF ${g.cpf||'___.___.___-__'}, RG ${g.rg||'________'}, residente em ${g.endereco?g.endereco+', ':''}${g.bairro}, Brasília/DF.
${menor(g)?`<b>Responsável legal (contratante menor de idade):</b> ${respTxt(g)||'________'}.
`:''}<b>Acompanhante de parto:</b> ${g.acomp}.
<b>Contratada:</b> ${CFG.nome}, ${CFG.papel.toLowerCase()}, ${CFG.coren||'registro ________'}.

<b>1. Objeto.</b> ${p.nome}: ${p.desc.replace('+ ','')}. Data provável do parto: ${flong(g.dpp)}.

<b>2. Valor.</b> ${R(total(g))}${g.ajuste?` (${g.ajuste.toLowerCase()})`:''}.

<b>3. Pagamento.</b> ${CFG.pagamentos[g.pag]}:
${ps.map(x=>`· ${ps.length>1?x.n+'/'+x.de+': ':''}${R(x.v)} em ${f2(x.venc)}/${x.venc.getFullYear()}`).join('\n')}

<b>4. Sobreaviso.</b> De ${f2(add(g.dpp,CFG.sobre.ini))} (37 semanas) a ${f2(add(g.dpp,CFG.sobre.fim))} (42 semanas), com disponibilidade 24 horas.

<b>5. Pós-parto.</b> Consulta de amamentação domiciliar ou hospitalar e reavaliação em consultório.

<b>6. Cancelamento.</b> ________.

Brasília, ${flong(TODAY)}.`;
}
function sheet(h){$('layer').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)$('layer').innerHTML=''"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${h}<div class="btn-row"><button class="btn-line" onclick="$('layer').innerHTML=''">Fechar</button></div></div></div>`}
function contrato(id){const g=G.find(x=>x.id===id);sheet(`<div class="t-title" style="margin-bottom:12px">Contrato</div>${menor(g)&&!g.respNome?`<div class="note" style="margin-bottom:12px">${I.info}<div><b>Gestante menor de 18 anos sem responsável legal.</b> Preencha em "Corrigir dados" antes de enviar.</div></div>`:''}<div class="contract">${texto(g,parcelas(g))}</div>${TPL?'':`<div class="note">${I.info}<div>Sem modelo cadastrado. Em Gestantes, role até o fim e toque em "Modelo de contrato".</div></div>`}`)}
function contratoNova(){const g=novaG();if(g)sheet(`<div class="t-title" style="margin-bottom:12px">Contrato</div><div class="contract">${texto(g,parcelasNova(g))}</div>`)}

(async()=>{
  if(/error_description=/.test(HASH)){splash('Esse link venceu ou já foi usado. Peça um novo em "Esqueci a senha".');setTimeout(()=>{history.replaceState(null,'',location.pathname);splash()},5000);return}
  const {data}=await sb.auth.getSession();
  if(data.session&&(VEIO==='invite'||VEIO==='recovery'||VEIO==='signup')){USER=data.session.user;telaSenha(VEIO);return}
  if(data.session){splash('Carregando suas gestantes…');await iniciar(data.session)}else splash();
  sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')location.reload()});
})();
</script>
</body>
</html>
